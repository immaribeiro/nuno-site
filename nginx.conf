map $http_cf_connecting_ip $real_ip {
    default $http_cf_connecting_ip;
    "" $remote_addr;
}

upstream hermes_bridge {
    server 192.168.5.2:8643 max_fails=2 fail_timeout=30s;
    server 192.168.8.161:8643 max_fails=2 fail_timeout=30s;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://hermes_bridge;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 160s;
        client_max_body_size 20m;
    }

    location ~* \.(?:css|js|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:jpg|jpeg|png|gif|webp|avif)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.json {
        alias /mnt/photos/manifest.json;
        add_header Cache-Control "no-cache";
    }

    # Live site data — served from the hostPath mount (photos pattern), so
    # events/news/topics updates go live the instant the host files change,
    # with no image rebuild or rollout. The baked image copy is the fallback
    # only (exact-match locations take precedence over the regex below).
    location = /events.json  { alias /mnt/site-data/events.json;  add_header Cache-Control "no-cache"; }
    location = /news.json    { alias /mnt/site-data/news.json;    add_header Cache-Control "no-cache"; }
    location = /topics.json  { alias /mnt/site-data/topics.json;  add_header Cache-Control "no-cache"; }
    location = /pinned.json  { alias /mnt/site-data/pinned.json;  add_header Cache-Control "no-cache"; }
    location = /couple.json  { alias /mnt/site-data/couple.json;  add_header Cache-Control "no-cache"; }
    location = /quotes.json  { alias /mnt/site-data/quotes.json;  add_header Cache-Control "no-cache"; }

    location ^~ /photos/ {
        alias /mnt/photos/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
