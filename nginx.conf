map $http_cf_connecting_ip $real_ip {
    default $http_cf_connecting_ip;
    "" $remote_addr;
}

upstream hermes_bridge {
    server 192.168.5.2:8643 max_fails=2 fail_timeout=30s;
    server 192.168.8.161:8643 max_fails=2 fail_timeout=30s;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://hermes_bridge;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 160s;
        client_max_body_size 20m;
    }

    location ~* \.(?:css|js|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:jpg|jpeg|png|gif|webp|avif)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
